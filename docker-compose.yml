version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: codemind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: codemind
      POSTGRES_PASSWORD: codemind_dev_password
      POSTGRES_DB: codemind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codemind -d codemind"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codemind-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    container_name: codemind-ai-service
    restart: unless-stopped
    environment:
      - PORT=8000
      - INTERNAL_SERVICE_TOKEN=dev_internal_service_token_codemind_secret_key_64bit
      - AI_PROVIDER=mock
      - AI_MODEL=mock-agent-v1
      - LOG_LEVEL=info
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/internal/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: codemind-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      - NODE_ENV=development
      - PORT=3000
      - FRONTEND_ORIGIN=http://localhost:5173
      - DATABASE_URL=postgresql://codemind:codemind_dev_password@postgres:5432/codemind
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=dev_jwt_access_secret_codemind_change_in_production_32chars!
      - INTERNAL_SERVICE_TOKEN=dev_internal_service_token_codemind_secret_key_64bit
      - AI_SERVICE_URL=http://ai-service:8000
      - MAX_SOURCE_BYTES=500000
      - MAX_FILES_PER_REVIEW=30
      - REVIEW_TIMEOUT_SECONDS=300
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: codemind-worker
    command: ["npm", "run", "worker"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://codemind:codemind_dev_password@postgres:5432/codemind
      - REDIS_URL=redis://redis:6379
      - INTERNAL_SERVICE_TOKEN=dev_internal_service_token_codemind_secret_key_64bit
      - AI_SERVICE_URL=http://ai-service:8000
      - REVIEW_TIMEOUT_SECONDS=300

  web:
    build:
      context: ./services/web
      dockerfile: Dockerfile
    container_name: codemind-web
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
